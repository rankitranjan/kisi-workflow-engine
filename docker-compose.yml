services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kisi
      POSTGRES_PASSWORD: kisi
      POSTGRES_DB: workflow_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisi -d workflow_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
