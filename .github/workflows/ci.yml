name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://kisi:kisi@127.0.0.1:5432/workflow_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git fetch --no-tags origin main
            git diff --check "origin/main...HEAD"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Start PostgreSQL
        run: docker compose -f docker-compose.yml -f e2e/postgres-port.yml up -d --wait

      - name: Integration tests
        run: npm run test:integration -w @kisi-workflow/api

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        id: e2e
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            e2e/test-results/
            playwright-report/
          if-no-files-found: ignore
